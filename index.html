let AC,master,crowdG,crowdF,nbuf;const base=.22;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}

function updateCursorWorld(){
  if(!cursor.active)return;

  ndc.y=-(cursor.sy/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  if(raycaster.ray.intersectPlane(groundPlane,hitPt)){
    cursor.wx=clamp(hitPt.x,-W+.8,W-.8);
    cursor.wz=clamp(hitPt.z,-H+.8,H-.8);

const kmap={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',ShiftLeft:'sprint',ShiftRight:'sprint',KeyQ:'tackle'};

    cursor.sx=e.clientX;cursor.sy=e.clientY;cursor.active=true;

  if(e.target!==renderer.domElement)return;
  cursor.sx=e.clientX;cursor.sy=e.clientY;cursor.active=true;
  if(e.pointerType!=='mouse')return;
  if(e.button===0)userKick('shoot');
  if(e.button===2)userKick('pass');

const joyEl=$('joy'),knob=$('knob');
function joyMove(e){const r=joyEl.getBoundingClientRect(),m=r.width/2;let dx=e.clientX-(r.left+m),dy=e.clientY-(r.top+m);const d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}

joyEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});

function bind(id,name){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture(e.pointerId);b.classList.add('on');if(name==='shoot'||name==='pass')userKick(name);else act[name]=true});
['pointerup','pointercancel'].forEach(ev=>b.addEventListener(ev,e=>{e.stopPropagation();b.classList.remove('on');if(name!=='shoot'&&name!=='pass')act[name]=false}))}
bind('b-shoot','shoot');bind('b-pass','pass');bind('b-sprint','sprint');bind('b-tackle','tackle');
// ---- game
let state='menu',carrier=null,score=[0,0],timeLeft=180,gT=0,T=0,goalDone=false;
class P{constructor(team,role,name,hx,hz,user){this.team=team;this.role=role;this.user=user;this.hx=hx;this.hz=hz;this.dir=team===1?1:-1;
const c=team===1?[role==='GK'?0xf1c40f:0x1f6fe0,0xffffff,0xffffff]:[role==='GK'?0xa569bd:0xd62828,0x222222,0x222222];
this.root=new THREE.Group();this.m=human(...c);this.root.add(this.m);const lb=label(name,user?'#ffe14d':'#fff');lb.position.y=4;this.root.add(lb);
if(user){this.mk=new THREE.Mesh(new THREE.ConeGeometry(.4,.9,4),new THREE.MeshBasicMaterial({color:0xff3b30}));this.mk.rotation.x=Math.PI;this.root.add(this.mk)}scene.add(this.root);this.reset()}
reset(){this.x=this.hx;this.z=this.hz;this.vx=this.vz=0;this.face=this.dir>0?Math.PI/2:-Math.PI/2;this.hold=0;this.cd=0;this.kickT=0;this.ph=0;this.boost=0;this.saveCd=0}
step(dt){this.cd-=dt;this.saveCd-=dt;this.kickT-=dt;let tx=0,tz=0,sp=0;
if(this.user){
  let ix=(K.right?1:0)-(K.left?1:0)+joy.x,iz=(K.down?1:0)-(K.up?1:0)+joy.y;
  let mg=Math.hypot(ix,iz);
  const has=carrier===this,b=((K.sprint||act.sprint)?1:0)+(((K.tackle||act.tackle)&&has)?1:0);
  if(mg>.12){
    this.boost=b;sp=[6.5,9,11][b]*Math.min(1,mg);tx=ix/mg;tz=iz/mg;
  }else if(cursor.active){
    const dx=cursor.wx-this.x,dz=cursor.wz-this.z,dist=Math.hypot(dx,dz);
    if(dist>.45){
      this.boost=b;sp=[6.5,9,11][b]*Math.min(1,dist/1.5);tx=dx/dist;tz=dz/dist;
    }else this.boost=0;
  }else this.boost=0;
  if((K.tackle||act.tackle)&&carrier&&carrier.team!==1&&this.cd<=0&&Math.hypot(carrier.x-this.x,carrier.z-this.z)<2.4){carrier=this;this.cd=.8;this.hold=0}
}
else{const o=this.ai(dt);tx=o[0];tz=o[1];sp=o[2];this.boost=0}
this.vx+=(tx*sp-this.vx)*Math.min(1,dt*9);this.vz+=(tz*sp-this.vz)*Math.min(1,dt*9);
this.x=clamp(this.x+this.vx*dt,-W+.8,W-.8);this.z=clamp(this.z+this.vz*dt,-H+.8,H-.8);const s=Math.hypot(this.vx,this.vz);
if(s>.6){let d=Math.atan2(this.vx,this.vz)-this.face;d=Math.atan2(Math.sin(d),Math.cos(d));this.face+=d*Math.min(1,dt*14)}}
ai(dt){const b=ball.position,mine=carrier===this,own=carrier&&carrier.team===this.team,gx=this.dir*W,d=this.dir,fw=P.fw[this.team];let tx=this.hx,tz=this.hz,sp=6;
if(carrier&&carrier.team!==this.team&&this.cd<=0&&Math.hypot(carrier.x-this.x,carrier.z-this.z)<1.9&&Math.random()<(this.role==='FW'?2:1.2)*dt){carrier=this;this.cd=1;this.hold=0}
if(this.role==='GK'){if(mine){this.hold+=dt;if(this.hold>.9)passTo(this,fw);return[0,0,0]}
tz=clamp(b.z*.6,-GZ*1.6,GZ*1.6);tx=this.hx+d*clamp((b.x-this.hx)*d*.15,0,7);const dd=Math.hypot(b.x-this.x,b.z-this.z);
if(!carrier&&dd<9&&Math.abs(b.x-this.hx)<15){tx=b.x;tz=b.z;sp=6.8}}
else if(this.role==='DEF'){if(mine){this.hold+=dt;tx=gx;tz=0;if(this.hold>.7)passTo(this,fw)}
else if(own){tx=b.x-d*12;tz=-b.z*.3}else if(b.x*d<4||!carrier){tx=b.x-d*2;tz=b.z}else{tx=this.hx;tz=b.z*.5}}
else{if(mine){this.hold+=dt;tx=gx;tz=Math.sin(T*.8+this.team)*8;sp=6.4;const td=Math.hypot(gx-this.x,this.z);if(td<24&&this.hold>.35){const gz=rnd(-GZ+.7,GZ-.7),dx=gx-this.x,dz=gz-this.z,l=Math.hypot(dx,dz);strike(this,dx/l,dz/l,rnd(26,30),rnd(1,3.5))}}
else if(own){tx=b.x+d*12;tz=-b.z*.5}else{tx=b.x;tz=b.z;sp=6.4}}
const dx=tx-this.x,dz=tz-this.z,l=Math.hypot(dx,dz);return l>.8?[dx/l,dz/l,sp]:[0,0,0]}
anim(dt){const s=Math.hypot(this.vx,this.vz);this.ph+=s*dt*1.5;const a=Math.min(1,s/6)*.9,m=this.m;m.L.rotation.x=Math.sin(this.ph)*a;m.R.rotation.x=-Math.sin(this.ph)*a;m.AL.rotation.x=-Math.sin(this.ph)*a*.8;m.AR.rotation.x=Math.sin(this.ph)*a*.8;
if(this.kickT>0){m.R.rotation.x=-1.3*(this.kickT/.22)}m.rotation.x=Math.min(.25,s*.02);
this.root.position.set(this.x,0,this.z);m.rotation.y=this.face;if(this.mk)this.mk.position.y=5+Math.sin(T*5)*.2}}
const players=[new P(1,'GK','Uğurcan',-46,0),new P(1,'DEF','H. Maguire',-28,0),new P(1,'FW','J. Alvarez (SEN)',-8,0,true),new P(2,'GK','Donnarumma',46,0),new P(2,'DEF','Gabriel M.',28,0),new P(2,'FW','Semih Kılıçsoy',8,0)];
const user=players[2];P.fw={1:players[2],2:players[5]};
function strike(p,dx,dz,pow,lift){carrier=null;ball.vx=dx*pow;ball.vz=dz*pow;ball.vy=lift;ball.position.y=Math.max(ball.position.y,R+.05);ball.noPick=p;ball.noT=.3;p.kickT=.22;p.hold=0;p.face=Math.atan2(dx,dz);kickSnd(Math.min(1,pow/30))}
function passTo(p,t){const px=t.x+t.vx*.4,pz=t.z+t.vz*.4,dx=px-p.x,dz=pz-p.z,l=Math.hypot(dx,dz)||1;strike(p,dx/l,dz/l,clamp(l*1.4+8,12,24),0)}
function userKick(type){if(state!=='play'||carrier!==user)return;let dx=Math.sin(user.face),dz=Math.cos(user.face);
if(type==='shoot'){const gz=clamp(user.z+dz*8,-GZ+.7,GZ-.7),tx=W-user.x,tz=gz-user.z,td=Math.hypot(tx,tz);if((dx*tx+dz*tz)/td>.8){dx=tx/td;dz=tz/td}strike(user,dx,dz,30,Math.min(4,1.5+td*.05))}
else{let best=null,bs=.45;for(const q of players)if(q.team===1&&q!==user){const ex=q.x-user.x,ez=q.z-user.z,l=Math.hypot(ex,ez),s=(dx*ex+dz*ez)/l;if(s>bs&&l>4){bs=s;best=q}}
if(best)passTo(user,best);else strike(user,dx,dz,17,0)}}
function ballStep(dt){const b=ball,p=b.position;
if(carrier){const c=carrier,off=.9+.12*c.boost,nx=c.x+Math.sin(c.face)*off,nz=c.z+Math.cos(c.face)*off,k=Math.min(1,dt*18),dx=(nx-p.x)*k,dz=(nz-p.z)*k;p.x+=dx;p.z+=dz;p.y=R;b.vx=b.vy=b.vz=0;roll(dx,dz)}
else{b.vy-=22*dt;p.x+=b.vx*dt;p.y+=b.vy*dt;p.z+=b.vz*dt;if(p.y<R){p.y=R;b.vy=b.vy<-2.5?-b.vy*.5:0}
const f=Math.exp(-(p.y<=R+.02?.75:.1)*dt);b.vx*=f;b.vz*=f;if(p.y<=R+.02&&Math.hypot(b.vx,b.vz)<.15)b.vx=b.vz=0;roll(b.vx*dt,b.vz*dt)}
if(Math.abs(p.z)>H+1){p.z=Math.sign(p.z)*(H+1);b.vz*=-.7}
if(Math.abs(p.x)>W){if(Math.abs(p.z)<GZ&&p.y<GH){if(!goalDone){goalDone=true;goal(p.x>0?1:2)}const m=W+2.3;if(Math.abs(p.x)>m){p.x=Math.sign(p.x)*m;b.vx*=-.15}b.vz*=.9}else{p.x=Math.sign(p.x)*W;b.vx*=-.7;if(carrier)carrier=null}}
b.noT-=dt;if(state!=='play'||carrier&&0)return;
const sp=Math.hypot(b.vx,b.vz);
for(const q of players){const d=Math.hypot(p.x-q.x,p.z-q.z);
if(q.role==='GK'&&!carrier&&q.saveCd<=0&&sp>3&&Math.abs(p.x-q.x)<2&&Math.abs(p.z-q.z)<2.6&&p.y<2.7&&Math.abs(p.x)>W-17){q.saveCd=.6;if(Math.random()<.65){carrier=q;q.hold=0;b.vx=b.vz=0}else{b.vx*=-.4;b.vz+=rnd(-6,6);b.noPick=q;b.noT=.4;cheer(.3,1.5)}continue}
if(!carrier&&p.y<1.4&&d<1.4&&sp<26&&!(b.noPick===q&&b.noT>0)){carrier=q;q.hold=0}}}
function goal(w){state='goal';gT=2.8;score[w-1]++;$('s1').textContent=score[0];$('s2').textContent=score[1];$('splash').style.display='block';cheer(.75,4.5);cheerVis=1}
function reset(){carrier=null;cursor.active=false;ball.position.set(0,R,0);ball.vx=ball.vy=ball.vz=0;ball.noPick=null;goalDone=false;players.forEach(p=>p.reset())}
function startMatch(){initAudio();if(AC&&AC.state==='suspended')AC.resume();$('n1').textContent=($('tn').value.trim()||'TAKIMIM').toUpperCase();score=[0,0];$('s1').textContent=$('s2').textContent=0;timeLeft=180;$('tm').textContent='3:00';
$('menu').style.display='none';$('sb').style.display='flex';$('splash').style.display='none';$('joy').style.display='block';$('btns').style.display='block';reset();state='play';whistle(.9)}
function endMatch(){state='end';whistle(.7,3);cheer(.5,3);$('tm').textContent='0:00';setTimeout(()=>{const r=score[0]>score[1]?'KAZANDIN!':score[0]<score[1]?'KAYBETTİN':'BERABERE';$('mt').textContent='MAÇ BİTTİ — '+r;$('go').textContent='TEKRAR OYNA';$('help').textContent=$('n1').textContent+' '+score[0]+' - '+score[1]+' TAKIM 2';$('menu').style.display='flex';$('sb').style.display='none';$('joy').style.display=$('btns').style.display='none';joy.x=joy.y=0;cursor.active=false},2200)}
$('go').onclick=startMatch;
// ---- loop
const cam={x:0,z:0};let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
if(state==='play'||state==='goal'){if(state==='play'){updateCursorWorld();players.forEach(p=>p.step(dt));
for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){const a=players[i],c=players[j],dx=c.x-a.x,dz=c.z-a.z,d=Math.hypot(dx,dz);if(d<1.3&&d>.01){const o=(1.3-d)/2/d;a.x-=dx*o;a.z-=dz*o;c.x+=dx*o;c.z+=dz*o}}
timeLeft-=dt;const t=Math.max(0,Math.ceil(timeLeft));$('tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(timeLeft<=0)endMatch()}
else{players.forEach(p=>{p.vx*=.9;p.vz*=.9});gT-=dt;if(gT<=0){$('splash').style.display='none';reset();state='play';whistle(.5)}}
ballStep(dt)}
players.forEach(p=>p.anim(dt));ball.rotation.order;
cheerVis=Math.max(0,cheerVis-dt*.25);updFans(T);
const k=1-Math.exp(-4*dt),bp=ball.position;cam.x+=(clamp(bp.x,-40,40)-cam.x)*k;cam.z+=(bp.z*.35-cam.z)*k;
camera.position.set(cam.x,24,cam.z+22);camera.lookAt(cam.x,0,cam.z-1);
sun.target.position.set(cam.x,0,cam.z);sun.position.set(cam.x+18,50,cam.z+14);
renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
